#==============================================================================
#  Rede de filas do T1
#
#  Fila 1: G/G/1, chegadas entre 2..4, atendimento entre 1..2
#  Fila 2: G/G/2/5, atendimento entre 4..6
#  Fila 3: G/G/2/10, atendimento entre 5..15
#
#  A soma das probabilidades de saida de uma fila que nao chega a 1.0
#  corresponde aos clientes que vao embora da rede.
#  Q2 manda 0.2 para fora e Q3 manda 0.3.
#
#  DO NOT DELETE THE NEXT LINE STARTED BY '!'
!PARAMETERS
arrivals:
   Q1: 2.0

queues:
   Q1:
      servers: 1
      minArrival: 2.0
      maxArrival: 4.0
      minService: 1.0
      maxService: 2.0
   Q2:
      servers: 2
      capacity: 5
      minService: 4.0
      maxService: 6.0
   Q3:
      servers: 2
      capacity: 10
      minService: 5.0
      maxService: 15.0

network:
-  source: Q1
   target: Q2
   probability: 0.2
-  source: Q1
   target: Q3
   probability: 0.8
-  source: Q2
   target: Q1
   probability: 0.3
-  source: Q2
   target: Q3
   probability: 0.5
-  source: Q3
   target: Q2
   probability: 0.7

rndnumbersPerSeed: 100000
seeds:
- 42
